site_name: Jinx Manual
site_description: >-
  A walk through Jinx, a Swift library that keeps a local copy of JMAP
  data in sync with a server, written for people who know the protocol
  but have not built a client.
site_url: ""
use_directory_urls: true

theme:
  name: material
  # Zensical has two looks.  "classic" is that of Material for MkDocs, which
  # this manual was written for; the other, and the default, is "modern".
  variant: classic
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - toc.follow

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - 1. Orientation: 01-orientation.md
  - 2. One JSON: 02-json.md
  - 3. The wire: 03-wire.md
  - 4. Patches: 04-patches.md
  - 5. The synced object: 05-synced-object.md
  - 6. The store: 06-store.md
  - 7. Describing a type: 07-type-descriptors.md
  - 8. Sync in: 08-sync-in.md
  - 9. Sync out: 09-sync-out.md
  - 10. Windowed sync: 10-windowed.md
  - 11. Blobs: 11-blobs.md
  - 12. Running the engine: 12-running.md
  - 13. Testing: 13-testing.md
  - 14. Capstone: 14-capstone.md
  - Glossary: glossary.md
  - File map: file-map.md
