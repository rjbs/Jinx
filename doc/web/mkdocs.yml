site_name: Jinx
site_description: >-
  Jinx, a Swift library that keeps a local copy of JMAP data in sync with a
  server: a manual that walks through it, for people who know the protocol
  but have not built a client.
# The 404 page can be served at any depth, so it alone needs the site's path
# to find its style sheets, and it takes that from here.  Every other page
# links relatively.  If the site moves, change this, or the 404 page comes
# out unstyled.
site_url: https://semiotic.systems/jinx/
use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.tabs
    - content.code.copy
    - navigation.footer
    - navigation.top
    - toc.follow

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# A new unit must be added here, or it is built but appears in no menu.
nav:
  - Home: index.md
  - Manual:
    - manual/index.md
    - 1. Orientation: manual/01-orientation.md
    - 2. One JSON: manual/02-json.md
    - 3. The wire: manual/03-wire.md
    - 4. Patches: manual/04-patches.md
    - 5. The synced object: manual/05-synced-object.md
    - 6. The store: manual/06-store.md
    - 7. Describing a type: manual/07-type-descriptors.md
    - 8. Sync in: manual/08-sync-in.md
    - 9. Sync out: manual/09-sync-out.md
    - 10. Windowed sync: manual/10-windowed.md
    - 11. Blobs: manual/11-blobs.md
    - 12. Running the engine: manual/12-running.md
    - 13. Testing: manual/13-testing.md
    - 14. Capstone: manual/14-capstone.md
    - Glossary: manual/glossary.md
    - File map: manual/file-map.md
