site_name: Jinx
site_description: >-
  Jinx, a Swift library that keeps a local copy of JMAP data in sync with a
  server: a manual that walks through it, for people who know the protocol
  but have not built a client, and a reference to its public interface.
# The 404 page can be served at any depth, so it alone needs the site's path
# to find its style sheets, and it takes that from here.  Every other page
# links relatively.  If the site moves, change this, or the 404 page comes
# out unstyled.
site_url: https://semiotic.systems/jinx/
use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.tabs
    - content.code.copy
    - navigation.footer
    - navigation.top
    - toc.follow

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# A new unit must be added here, or it is built but appears in no menu.  So
# must a new top-level declaration in one of the library modules, and
# prepare fails until it is.
