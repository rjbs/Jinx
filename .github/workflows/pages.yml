# The site is built and deployed by imprint's workflow, which every Semiotic
# Systems site shares.  This one says when.
name: Deploy the site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'doc/web/**'
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'bin/docc-manual'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: rjbs/semiotic-imprint/.github/workflows/site.yml@main
    with:
      # The reference is made by building Jinx, which builds only on macOS,
      # and with an SDK new enough for its platform requirement.
      runs-on: xcode-27
