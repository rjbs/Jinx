name: Deploy the site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'doc/web/**'
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'bin/docc-manual'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The reference is made by building Jinx, which builds only on macOS,
    # and with an SDK new enough for its platform requirement.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/configure-pages@v5

      - name: Install Zensical
        run: pip install -r doc/web/requirements.txt

      - name: Write the reference
        run: doc/web/prepare

      - name: Build site
        run: zensical build --clean --strict
        working-directory: doc/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/web/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
